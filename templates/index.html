<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Library &amp; Book Rental System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📚 Online Library &amp; Book Rental</h1>
    <nav><a href="/">Browse Books</a><a href="/admin">Admin Dashboard</a></nav>
  </header>

  <div class="layout">
    <main>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by title or author...">
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </main>

    <aside class="cart">
      <h2>🛒 Rental Cart (<span id="count">0</span>)</h2>
      <div id="cartItems"><div class="empty">No books selected yet.</div></div>

      <div class="field"><label for="name">Member name</label><input id="name" placeholder="e.g. Jayasree R"></div>
      <div class="field"><label for="mid">Member ID</label><input id="mid" placeholder="e.g. LIB1024"></div>
      <div class="field">
        <label for="days">Rental period</label>
        <select id="days">
          <option value="3">3 days</option><option value="7" selected>7 days</option>
          <option value="14">14 days</option><option value="21">21 days</option><option value="30">30 days</option>
        </select>
      </div>
      <div class="total"><span>Total rent</span><span>₹<span id="total">0.00</span></span></div>
      <button id="rentBtn" style="width:100%" disabled>Confirm Rental</button>
    </aside>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>✅ Rental Confirmed</h2>
      <div>Your rental ID</div>
      <div class="id" id="mId"></div>
      <p id="mInfo"></p>
      <button id="mClose">Close</button>
    </div>
  </div>
  <div id="toast"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
